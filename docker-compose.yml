# Production stack for a single Hostinger VPS.
#
#   caddy  — public edge. Terminates TLS (auto-issued) and proxies to the app.
#   app    — Next.js. No published host port; reachable only over the compose network.
#            Holds the only lock on the console — its own `/login` session.
#   db     — PostgreSQL. No published host port either; nothing outside this file
#            should ever be able to reach 5432.
#
# Caddy no longer carries a Basic Auth gateway. It was a second credential in
# front of the app's own sign-in, which meant two passwords to open one page.

name: evokz

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Without this, initdb picks the C locale and text ordering differs from
      # what the app was developed against.
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      # `-h 127.0.0.1` forces a real TCP check; the socket-only default reports
      # ready during the init phase when the server is still bootstrapping.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [internal]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      db:
        # The entrypoint runs `prisma migrate deploy` immediately, so starting
        # before Postgres accepts connections is a crash loop, not a retry.
        condition: service_healthy
    networks: [internal]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    # Domain and ACME contact only. Keep `$` out of every value here: Compose
    # interpolates env_file contents, so `$anything` is silently replaced with an
    # environment lookup — the trap that used to force the gateway password into
    # a bind-mounted file of its own.
    env_file: .env.caddy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data     # issued certificates — losing this re-triggers ACME
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - app
    networks: [internal]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  caddy_logs:

networks:
  internal:
    driver: bridge
