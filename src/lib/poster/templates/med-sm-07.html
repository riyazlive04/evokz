<!--
  Med-SM-7 — the emergency variant. Red on navy, no service list, a sentence of
  body copy where every other template in the vertical puts icons.

  Reference: /api/templates/91215d95-ac0e-47a1-8d42-0bde196f430b/thumbnail?full=1

  **This is the template the old renderer named as impossible.** Its first line
  is set at roughly twice the size of the rest — "24/7" over "Emergency Care" —
  and `headlineSize` took a line *count*, so every line in a headline was the
  same size by construction. Here it is one rule: the accented line gets its own
  scale, and which line is accented is already a decision the copy makes.

  It is also the only Medicals design with `featureCount: 0`. A day's copy still
  carries features; this template draws none of them, exactly as templates
  without a body slot ignore `body`.
-->
