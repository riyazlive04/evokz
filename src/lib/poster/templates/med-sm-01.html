<!--
  Med-SM-1 — the densest design in the vertical: logo, headline, body, a titled
  services card, a figure, a banded promise, a contact bar and a call to action.

  Reference: /api/templates/828b9a5c-f2f8-423e-9731-65be63e0c314/thumbnail?full=1

  It is the only one that draws `body` *and* `ctaLabel` *and* four features with
  their labels, which makes it the template most likely to catch a copy-stage
  regression — and the one most sensitive to long copy, since everything is
  stacked and there is little slack. The services card is therefore the block
  that gives: it shrinks before anything else does.

  The reference titles that card "OUR SERVICES". That title is not drawn here.
  There is no field for it, and typing it would be exactly the hardcoded-words
  fault `check:templates` exists to refuse — a heading is a word, however
  decorative it looks.
-->
