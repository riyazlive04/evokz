<!--
  Med-SM-4 — "We Care / For You" on navy, with a lit emblem to the right of the
  service list.

  Reference: /api/templates/9d98d335-ea66-4869-984c-c0e50c2292bb/thumbnail?full=1

  Two things distinguish it from Med-SM-16, which it otherwise resembles. Its
  service rows are joined by a dotted rule, so the four read as a sequence rather
  than as four independent marks — drawn here as a border on the row rather than
  as a separate element, so a dropped feature takes its own connector with it.
  And its contact bar is a white pill floating clear of the edge rather than a
  band running to it.
-->
