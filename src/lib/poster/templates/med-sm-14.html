<!--

  Reference: /api/templates/3ad068ab-6f7e-4623-9649-d8015a38070d/thumbnail?full=1

  Measured: ground #f1f1f3, logo 71-255, headline caps 332-411 and 441-520
  (79px caps, 109px apart, both centred on x 444), headline inks #0b7684 and
  #0c2470.

  The photograph is the whole poster rather than a cell, which is the first time
  that arrangement appears in the library. It needs a scrim: a generated still is
  not guaranteed to be pale where the type lands, and a headline that happens to
  fall on a dark passage is unreadable with nothing in the log to say so. The

  and does its work only when the day's image is not.
