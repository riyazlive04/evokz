<!--
  Med-SM-17 — the prospectus layout: a headline panel, a card of services with
  body copy, a call to action, and a three-up contact row.

  Reference: /api/templates/020cc456-55f3-4f26-a329-c70f4a6ff972/thumbnail?full=1

  The one design in the vertical that uses most of PosterCopy. Everywhere else
  `body`, `ctaLabel` and `websiteLabel` are written by the copy stage and drawn
  by nobody — which is legal and always has been, in the same way a template with
  no body slot ignores `body`. Here they all land, which makes this the template
  that would catch a regression in any of them.

  Two things it does that no other reference does: its headline is sentence case
  rather than caps, so it overrides the shared `text-transform`; and its services
  carry a sentence each, so the reference shows three rather than four.

  A fourth card is marked up all the same. `featureSlots` is a ceiling and the
  sheet decides the count, so a day carrying four features has to be able to draw
  four: capping the markup at the reference's own number meant a row an operator
  had filled in silently lost its last card. Three still renders as the reference
  does, because the fourth is removed by `data-when` when nothing fills it, and
  `data-fit="block"` scales the card either way. Ground sampled
  at #012027 with the panels at #0c5968.
-->

    justify-content: center;
    gap: 46px;
    z-index: 3;
  }
  .p17-contact {
    display: flex;
    align-items: center;

    min-width: 0;
  }
  .p17-contact > svg {

    display: flex;

    justify-content: center;

  }
  .p17-contact svg use { color: #ffffff; }
  .p17-contact-text { display: flex; flex-direction: column; min-width: 0; }
  .p17-contact-text i {

  .p17-divider { width: 1px; align-self: stretch; background: #d6e6e8; flex: none; }
