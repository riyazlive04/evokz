<!--
  Con-SM-1 - the premium end of the vertical: cream and gold, a chevron band of
  photography, a values row with a sentence under each mark, and a dark foot
  carrying the promise, the strapline and the number.

  Reference: /api/templates/5a621020-3e1c-4134-94d9-d163fb266b5e/thumbnail?full=1

  The only Constructions design with service marks, and the only one that uses
  `features[].body`. It is therefore the template in this vertical that would
  catch a copy-stage regression, in the same way Med-SM-17 is in the other.

  Four things the first version left on the table, none of which HTML and CSS
  had any trouble with once they were attempted:

    the chevron       The reference's whole identity is a downward chevron. It
                      cuts the top of the photograph and cuts the bottom again,
                      and a gold hairline traces the upper cut. Drawn here as a
                      `clip-path` on the photo block with the gold as that
                      block's own background, so one pair of numbers makes both
                      cuts and the edge that shows through them.
    the overlay       The headline sits *on* the photograph in the reference,
                      over a cream scrim that has faded out by the horizon.
                      Drawn flat on cream it read as a different, plainer
                      design - which is what shipped.
    the marks         Four Constructions marks rather than four Medicals ones. A
                      stethoscope stood over SAFETY on a live poster because the
                      kit had no hard hat and nothing here reads a mark for
                      meaning. See the constructions section of `_kit.svg`.
    the strapline     The reference's foot carries two lines. The second is the
                      client's own strapline, which the format has always had -
                      `brandTagline`, drawn through `.pk-strapline` with the
                      flanking rules the reference gives it.

  What the reference has and this deliberately does not: the words BUILDING and
  STRONGER FUTURES set under the mark at the top, and an email chip beside the
  website in the contact row. The first is the reference's stand-in for the
  client's own lockup, so the whole area goes to `.pk-logo` - the space belongs
  to the mark that is actually uploaded, and printing a second brand name beside
  it would be printing the wrong one. The second has no source: `PosterIdentity`
  carries a phone and a website and no address, so half that row would be a slot
  nothing could ever fill.
-->

<style>
  .b1 {
    --hl-size: 80px;
    --hl-stretch: 66%;
    --hl-leading: 1.12;
    --hl-ink: #222c3a;
    --hl-accent: #96742f;
    --logo-w: 330px;
    --logo-h: 232px;
    --logo-filter: brightness(0);

    /*
     * The chevron, as three numbers.
     *
     * `--chev-drop` is how much deeper the shape runs at the centre than at the
     * edges on the upper cut, `--chev-rise` the same for the lower one, and
     * `--chev-edge` the weight of the gold hairline. Both cuts are driven from
     * this one place, which is the point: a top and a bottom that disagreed by
     * two degrees would read as a mistake rather than as a motif.
     */
    --chev-drop: 132px;
    --chev-rise: 58px;
    --chev-edge: 4px;

    position: absolute;
    inset: 0;
    background: #f7f3ea;
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 26px 30px 0;
    overflow: hidden;
  }

  /* --- the chevron band of photography ---------------------------------- */
  .b1-photo {
    position: absolute;
    left: 0;
    right: 0;
    top: 196px;
    height: 862px;
    /*
     * The gold is this block's own background and the picture is clipped inside
     * it, so the lower hairline is the few pixels of parent left showing along
     * the cut. Stroking the shape separately would mean keeping a second
     * polygon in step with the first for ever.
     */
    background: #b08c46;
    clip-path: polygon(
      0 0,
      50% var(--chev-drop),
      100% 0,
      100% calc(100% - var(--chev-rise)),
      50% 100%,
      0 calc(100% - var(--chev-rise))
    );
    z-index: 0;
  }
  .b1-photo img {
    position: relative;
    clip-path: polygon(
      0 var(--chev-edge),
      50% calc(var(--chev-drop) + var(--chev-edge)),
      100% var(--chev-edge),
      100% calc(100% - var(--chev-rise) - var(--chev-edge)),
      50% calc(100% - var(--chev-edge)),
      0 calc(100% - var(--chev-rise) - var(--chev-edge))
    );
  }
  /*
   * The scrim the headline sits on: cream at the top of the band, gone by the
   * horizon. It is what makes the join with the cream above invisible, so the
   * type reads on sky rather than on scaffolding.
   */
  .b1-photo::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
      180deg,
      #f7f3ea 0%,
      rgba(247, 243, 234, 0.88) 16%,
      rgba(247, 243, 234, 0.55) 30%,
      rgba(247, 243, 234, 0) 44%
    );
  }
  /*
   * The gold line on the upper cut, drawn over the scrim rather than under it.
   * As part of the photo block it would be painted first and then covered by
   * the cream, which is the one place the scrim has to be opaque.
   */
  .b1-edge {
    position: absolute;
    left: 0;
    right: 0;
    top: 196px;
    height: calc(var(--chev-drop) + var(--chev-edge) + 2px);
    background: #b08c46;
    clip-path: polygon(
      0 0,
      50% var(--chev-drop),
      100% 0,
      100% var(--chev-edge),
      50% calc(var(--chev-drop) + var(--chev-edge)),
      0 var(--chev-edge)

    z-index: 1;
  }
