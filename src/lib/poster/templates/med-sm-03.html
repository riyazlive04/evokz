<!--
  Med-SM-3 — teal field on the left, photograph on the right, divided by an
  S-curve rather than a straight edge.

  Reference: /api/templates/c7c24a2f-93f9-4d47-92b3-ac22b44a8c4f/thumbnail?full=1

  The curve is the whole design, and it is the reason this one could not have
  been drawn before: the layout spec's chrome was a card, a blob and a dome, so a
  full-height sweep dividing the poster into two fields had no word. Here it is a
  clip path on the teal field, which means the photograph behind it needs no
  matching mask — the two always meet exactly, whatever the day's still is.
-->
