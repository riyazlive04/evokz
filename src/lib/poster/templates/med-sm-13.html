<!--

  The only green template in the vertical. Its palette is sampled rather than
  derived from the others: ground foliage, #336716 in the footer band, #2d710f
  on the accent line and #082158 navy on the second.

  Structurally it is Med-SM-14 with the service list turned on its side — four

    inset: 0;
    background: linear-gradient(

  /*
