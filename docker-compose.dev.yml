name: evokz-ai-dev

services:
  db:
    image: postgres:16-alpine
    container_name: evokz_ai_dev_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: evokz_dev
      POSTGRES_PASSWORD: evokz_dev_password
      POSTGRES_DB: evokz_ai_dev
    ports:
      # 5434, not 5433: a native Windows PostgreSQL 18 service on the development
      # machine already listens on 5433 and shadows Docker's mapping, so
      # localhost:5433 reaches that server instead of this container.
      - "5434:5432"
    volumes:
      - evokz_ai_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evokz_dev -d evokz_ai_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  evokz_ai_dev_pgdata:
