  This vertical maps PosterCopy differently from Medicals, and the mapping is the
  thing to understand before reading the other eight:

    headlineLines   the caps headline, accent line in the alarm colour
    body            the subhead under it
    ctaLabel        the line above the number — an invitation, not a button
    callLabel       the word before the number ("Call")
    website         the strip at the very foot
